# Sprint 5.25 PR #STATIC-SITE-SYNC-CRITICAL — Static-site canonical-sync drift-detection CI gate
#
# Per Sprint 5.25 PR #STATIC-SITE-SYNC-CRITICAL dispatch §4.2 AC-8/9/10 + Pattern-32
# 30th-instance NEW class (substrate-state-vs-LIVE-customer-surface divergence at
# STATIC-HTML-MARKETING-PAGE layer) closure.
#
# Asserts the static site never drifts from canonical Phronesis substrate:
#   (a) static-site vertical list + count match canonical 12-vertical roster
#   (b) static-site tier nomenclature matches Pricing_Strategy v1.2 canonical tier IDs
#   (c) no superseded tier names present ("T1 Starter" / "T2 Professional" /
#       "T3 Team" / "T4 Enterprise" are the Sprint-5.8-era deprecated nomenclature)
#   (d) Themis rules-count claim within tolerance of canonical (144 rules / 14 clusters)
#   (e) no "eight verticals" / "5 of 8" / "five live" stale Sprint-5.8-era counts
#
# Cross-references:
#   - Pricing_Strategy v1.2 canonical tier IDs (BINDING)
#   - PR #159 /v1/catalog dynamic-sourcing (machine-readable sibling drift class)
#   - Pattern-43 BCP per-event substrate-evidence-attestation discipline
#   - Lesson #27 BINDING grep-verify discipline + Sprint 5.25 carve-out extension
#     (grep ambiguous Unicode + literal-value-being-bumped; not just field-name)
#   - Algorithm_Protection §6.X NEW (algo-protection-gate.yml SIBLING gate)

name: Static-site canonical-sync drift-detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  forbidden-stale-references:
    runs-on: ubuntu-latest
    name: Forbidden Sprint-5.8-era stale references
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stale vertical-count references (must be absent)
        run: |
          set -e
          STALE_PATTERNS=(
            "Eight verticals"
            "eight verticals"
            "5 of 8"
            "five live"
            "Five live"
            "Five verticals"
            "five vertical"
            "Five-vertical-deep"
            "five-vertical-deep"
            "All eight"
          )
          FAILED=0
          for pattern in "${STALE_PATTERNS[@]}"; do
            if grep -rn -l "$pattern" --include="*.html" --include="*.json" site; then
              echo "FAIL: stale vertical-count reference '$pattern' present in repo"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "FAIL: Sprint-5.8-era vertical-count references must be replaced with canonical 12-vertical-complete framing"
            exit 1
          fi
          echo "PASS: no stale vertical-count references"

      - name: Forbidden superseded tier names (Sprint-5.8-era T1-T4 deprecated)
        run: |
          set -e
          FORBIDDEN_TIERS=(
            "T1 Starter"
            "T2 Professional"
            "T3 Team"
            "T4 Enterprise"
          )
          FAILED=0
          for tier in "${FORBIDDEN_TIERS[@]}"; do
            # Allow citations within EXACT-DEPRECATION-CONTEXT only (e.g. ADR or change-log narratives describing the move)
            # In static-site HTML this should never appear in customer-facing copy
            if grep -rn "$tier" --include="*.html" --include="*.json" site; then
              echo "FAIL: superseded Sprint-5.8-era tier name '$tier' present"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "FAIL: tier nomenclature must match Pricing_Strategy v1.2 canonical (Discovery / Inquiry / Practice / Practice+ / Enterprise + Standard/Deep/Strategic/Strategic Sync Compute)"
            exit 1
          fi
          echo "PASS: no superseded tier names"

  canonical-substrate-attestation:
    runs-on: ubuntu-latest
    name: Canonical 12-vertical + Pricing v1.2 references present
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 12-vertical canonical references present
        run: |
          set -e
          # Vertical list must include V#9-V#12 NEW names on any page that enumerates verticals
          # Allow the index.html OR verticals.html to be the canonical-list source.
          REQUIRED_VERTICAL_TOKENS=(
            "V#9"
            "V#10"
            "V#11"
            "V#12"
            "AI/AGI"
            "Physics"
            "Longevity"
            "Quantum"
          )
          FAILED=0
          for token in "${REQUIRED_VERTICAL_TOKENS[@]}"; do
            if ! grep -rn -l "$token" --include="*.html" site > /dev/null; then
              echo "FAIL: canonical V#9-V#12 token '$token' NOT present in any HTML file"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "FAIL: 12-vertical canonical references incomplete"
            exit 1
          fi
          echo "PASS: 12-vertical canonical references present"

      - name: Pricing v1.3 canonical tier names present in the published price list
        run: |
          set -e
          # Since Pricing v1.3 (ratified 2026-10-02) the legal pages refer tiers to the
          # published price list instead of naming them, so the tier names are checked
          # in that one source (pricing.json), never restated across HTML pages.
          for token in Discovery Record Practice; do
            if ! grep -q "\"name\": \"$token\"" site/pricing.json; then
              echo "FAIL: Pricing v1.3 tier '$token' NOT present in site/pricing.json"
              exit 1
            fi
          done
          echo "PASS: Pricing v1.3 tier names present in pricing.json"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust Center linkage present
        run: |
          set -e
          # The Trust Center surface lives at the Phronesis production deployment
          # (https://phronesis-jrstinehour.replit.app/trust). The static sites must
          # link to it from at least one location (footer typical).
          if ! grep -rn -l "trust" --include="*.html" site | xargs -I {} grep -l "trust" {} > /dev/null 2>&1; then
            echo "FAIL: no Trust Center reference present in any HTML file"
            exit 1
          fi
          if ! grep -rn "Trust Center" --include="*.html" site > /dev/null; then
            echo "FAIL: 'Trust Center' link text not present in any HTML file"
            exit 1
          fi
          echo "PASS: Trust Center linkage present"

  agent-fetchability-parity:
    runs-on: ubuntu-latest
    name: Agent-fetchability parity — non-browser GET returns real HTML
    # Per CC_4_7_POSITIONING_RECUT_AND_SITES_FIX_DISPATCH_20260525.md §D6 AC-D6-4.
    # Root cause documented: Cloudflare Pages auto-rewrites .html-suffix paths to
    # the canonical no-extension URL via a 308, returning a zero-byte body. The
    # canonical no-extension URLs themselves return real HTML for both browser
    # and non-browser User-Agents — this parity job locks that property in.
    #
    # Assertions per URL (root + 3 footer legal pages):
    #   - HTTP 200 for non-browser UA ("Mozilla/5.0 (compatible; agent)")
    #   - Body length > 1024 bytes (zero-byte / stub responses fail)
    #   - Body contains a non-empty <h1>...</h1> with meaningful text
    #
    # If a future Cloudflare config change or CDN reconfiguration causes the
    # canonical URLs to regress to .html-suffix-style 308-empty-body behavior,
    # this gate fails the build before the regression reaches production.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe canonical URLs as non-browser agent
        run: |
          set -e
          URLS=(
            "https://sustainablefinancepartner.com/"
            "https://sustainablefinancepartner.com/terms-of-service"
            "https://sustainablefinancepartner.com/privacy-policy"
            "https://sustainablefinancepartner.com/refund-policy"
          )
          UA="Mozilla/5.0 (compatible; agent)"
          FAILED=0
          for url in "${URLS[@]}"; do
            echo "--- Probing: $url"
            CODE=$(curl -sS -o /tmp/body.html -w "%{http_code}" -A "$UA" -L --max-time 30 "$url" || echo "000")
            SIZE=$(wc -c < /tmp/body.html | tr -d ' ')
            if [ "$CODE" != "200" ]; then
              echo "FAIL [$url]: status $CODE (expected 200)"
              FAILED=1
              continue
            fi
            if [ "$SIZE" -lt 1024 ]; then
              echo "FAIL [$url]: body too small ($SIZE bytes; expected > 1024)"
              FAILED=1
              continue
            fi
            # Extract first <h1>...</h1> innerText (DOTALL; strips nested inline
            # tags like <br>, <span>). If empty after stripping, the page is a stub.
            H1_TEXT=$(python3 <<'PYEOF'
          import re
          html = open('/tmp/body.html', 'r', encoding='utf-8', errors='replace').read()
          m = re.search(r'<h1[^>]*>(.+?)</h1>', html, re.DOTALL | re.IGNORECASE)
          if not m:
              print('')
          else:
              inner = re.sub(r'<[^>]+>', ' ', m.group(1))
              inner = re.sub(r'\s+', ' ', inner).strip()
              print(inner)
          PYEOF
          )
            if [ -z "$H1_TEXT" ]; then
              echo "FAIL [$url]: no non-empty <h1> in body"
              FAILED=1
              continue
            fi
            echo "PASS [$url]: status=$CODE size=$SIZE h1=$H1_TEXT"
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "FAIL: agent-fetchability parity regressed; non-browser GET against one or more canonical URLs no longer returns real HTML"
            exit 1
          fi
          echo "PASS: agent-fetchability parity holds for all canonical URLs"

  published-tree-layout:
    runs-on: ubuntu-latest
    name: Published tree is site/ — repository files stay outside it
    # §15.10.761 §2: the site publishes from a subfolder, not by ignore rules, so
    # the fix cannot regress by a forgotten entry. Cloudflare Pages publishes
    # site/ (the project's build output directory); the repository root is not
    # published. This job reads the checkout only.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Root holds repository files only; site/ holds public files only
        run: |
          set -euo pipefail
          ROOT_ALLOWED='^(README\.md|CLAUDE\.md|\.gitattributes|\.gitignore|\.github|site)$'
          FAILED=0
          for entry in $(git ls-files | cut -d/ -f1 | sort -u); do
            if [[ ! "$entry" =~ $ROOT_ALLOWED ]]; then
              echo "FAIL: '$entry' is at the repository root, which is not published; public files belong under site/"
              FAILED=1
            fi
          done
          for required in site/index.html site/404.html; do
            if [[ ! -f "$required" ]]; then
              echo "FAIL: $required is missing"
              FAILED=1
            fi
          done
          while IFS= read -r f; do
            case "$f" in
              site/skills/* | site/.github/* | */README.md | */CLAUDE.md | */.gitattributes | */.gitignore)
                echo "FAIL: '$f' is a repository file inside the published tree"
                FAILED=1
                ;;
            esac
          done < <(git ls-files site)
          if [[ "$FAILED" -ne 0 ]]; then
            exit 1
          fi
          echo "PASS: the root holds repository files only; site/ holds public files only"

  unpublished-paths-404:
    runs-on: ubuntu-latest
    name: Repository files answer 404 on the host; site/ files answer 200
    # §15.10.761 §2: /CLAUDE.md, /README.md, /skills/* and /.github/* return 404.
    # On a pull request this probes the PR's own Cloudflare Pages preview (built
    # with the project's current settings), so the PR stays red until the build
    # output directory is site/. main is not branch-protected and this check is
    # not required, so a red PR can still be merged: merge only on green. On a
    # push to main it waits for that commit's production deployment, then probes
    # both production hostnames. The probe itself: .github/scripts/published_tree_probe.sh
    needs: published-tree-layout
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for this commit's Cloudflare Pages deployment
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          url=$(bash .github/scripts/wait_for_pages_deploy.sh "$GITHUB_REPOSITORY" "$SHA" 1200)
          echo "Deployment: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Probe the PR preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          bash .github/scripts/published_tree_probe.sh "$PREVIEW_URL"

      - name: Probe production (apex and www)
        if: github.event_name != 'pull_request'
        run: |
          set -uo pipefail
          # The custom domains follow the new production deployment within
          # seconds; up to six attempts, 20 s apart, absorb that lag only.
          for attempt in 1 2 3 4 5 6; do
            if bash .github/scripts/published_tree_probe.sh \
                 https://sustainablefinancepartner.com \
                 https://www.sustainablefinancepartner.com; then
              exit 0
            fi
            echo "attempt $attempt failed"
            sleep 20
          done
          echo "FAIL: production does not serve exactly site/ after six attempts"
          exit 1
